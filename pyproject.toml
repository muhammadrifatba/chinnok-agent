[project]
name = "chinook-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "langgraph>=0.2.70",
    "langgraph-checkpoint>=2.0.16",
    "langgraph-checkpoint-postgres>=2.0.16",
    "langchain",
    "langchain-openai",
    "langchain-anthropic",
    "httpx>=0.28.0",
    "jsonpointer>=3.0",
    "deepagents>=0.6.0",
    "langsmith",
    "tzdata>=2025.2",
    "qdrant-client",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy",
    "psycopg[binary,pool]>=3.2.5",
    "sqlglot",
    "pyyaml>=6.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pypdf",
    "langchain-text-splitters",
    "fastembed",
    "langchain-google-genai>=4.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["test"]
pythonpath = ["."]
asyncio_mode = "auto"
python_files = "test_*.py"
markers = [
    "unit: pure unit tests without external service dependencies",
    "integration: integration tests requiring live Postgres or Qdrant services",
]
